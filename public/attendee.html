<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Available Events | EventHub</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Event<span>Hub</span></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#">Explore</a></li>
      <li><a href="#">My RSVPs</a></li>
    </ul>
    <button class="login-btn" onclick="logout()">Logout</button>
  </nav>

  <!-- Event Section -->
  <main class="dashboard">
    <div class="animate-on-scroll">
      <h2>Available Events</h2>
      <p class="section-subtitle">Discover and RSVP to the most exciting events happening soon.</p>
    </div>
    
    <section class="events-grid" id="eventContainer">
        <!-- Cards injected dynamically -->
    </section>
  </main>

  <!-- Event Details Modal -->
  <div class="event-form-modal" id="eventDetailsModal">
    <div class="event-form-container">
        <h2 id="detailTitle" style="text-align: left; margin-bottom: 1.5rem;">Event Title</h2>
        <div style="font-size: 1rem; color: var(--text-muted); line-height: 1.6;">
            <p style="margin-bottom: 0.75rem;"><strong style="color: var(--text);">📅 Date:</strong> <span id="detailDate"></span></p>
            <p style="margin-bottom: 0.75rem;"><strong style="color: var(--text);">📌 Venue:</strong> <span id="detailVenue"></span></p>
            <p style="margin-bottom: 0.75rem;"><strong style="color: var(--text);">🏷️ Category:</strong> <span id="detailCategory"></span></p>
            <p style="margin-bottom: 1.5rem;"><strong style="color: var(--text);">👤 Coordinator:</strong> <span id="detailCoordinator"></span></p>
            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid var(--border);" />
            <p><strong style="color: var(--text);">Description:</strong></p>
            <p id="detailDescription" style="margin-top: 0.5rem;"></p>
        </div>
        <button class="primary-btn" style="width: 100%; margin-top: 2.5rem;" onclick="closeDetailsModal()">Close Details</button>
    </div>
  </div>

  <!-- RSVP Modal -->
  <div id="rsvpModal" class="rsvp-modal">
    <div class="rsvp-form-container">
      <h2>RSVP for Event</h2>
      <p style="text-align: center; color: var(--text-muted); margin-top: -2rem; margin-bottom: 2rem;">Please provide your details to secure your spot.</p>
      <form onsubmit="submitRSVP(event)">
        <input type="hidden" id="eventId">
        <input type="text" id="userName" placeholder="Your Full Name" required />
        <input type="email" id="userEmail" placeholder="Your Email Address" required />
        <input type="tel" id="userMobile" placeholder="Your Mobile Number" required />

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="submit" class="primary-btn" style="flex: 2;">Confirm RSVP</button>
          <button type="button" class="secondary-btn" style="flex: 1;" onclick="closeRSVPModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="attendee.js"></script>
  <script src="animations.js"></script>
</body>
</html>
